[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "readlip-research-modules"
version = "0.1.0"
description = "Research modules for ReadLip, designed for TalkLip integration"
requires-python = ">=3.9"
dependencies = ["torch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["readlip*"]
